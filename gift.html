<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 🎁❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: linear-gradient(135deg, #ffd6e2, #fff0f5);

            font-family: Georgia, serif;

            color: #542832;
        }

        .gift-box {
            background: rgba(255, 255, 255, 0.75);

            padding: 50px 35px;

            border-radius: 30px;

            box-shadow: 0 15px 40px rgba(201, 54, 91, 0.2);

            max-width: 600px;
        }

        h1 {
            color: #c9365b;

            font-size: 42px;

            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;

            color: #8e4555;

            margin-bottom: 30px;
        }

        .gift {
            font-size: 120px;

            cursor: pointer;

            display: inline-block;

            transition: 0.3s;

            animation: bounce 2s infinite;
        }

        .gift:hover {
            transform: scale(1.15);
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

        }

        .open-button {
            display: inline-block;

            margin-top: 25px;

            padding: 15px 32px;

            background: linear-gradient(135deg, #ff6f91, #c9365b);

            color: white;

            text-decoration: none;

            border-radius: 50px;

            font-size: 19px;

            font-weight: bold;

            box-shadow: 0 8px 20px rgba(201, 54, 91, 0.3);

            transition: 0.3s;
        }

        .open-button:hover {
            transform: scale(1.08);
        }

    </style>

</head>

<body>

    <div class="gift-box">

        <h1>Wait... Shoniiii 🎁</h1>

        <p class="subtitle">
            I have one more little surprise for you... 🥹❤️
        </p>

        <div class="gift">
            🎁
        </div>

        <br>

        <a href="surprise.html" class="open-button">
            Open Your Gift 💝
        </a>

    </div>

</body>

</html>
