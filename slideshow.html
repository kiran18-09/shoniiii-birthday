<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(135deg, #ffd6e2, #fff0f5);

            font-family: Georgia, serif;

            text-align: center;

            color: #542832;

            padding: 35px 15px;
        }

        h1 {
            color: #c9365b;

            font-size: 45px;

            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 20px;

            color: #8e4555;

            margin-bottom: 30px;
        }


        /* =========================
           SLIDESHOW
           ========================= */

        .slideshow {
            position: relative;

            width: 90%;

            max-width: 850px;

            height: 550px;

            margin: auto;

            overflow: hidden;

            border-radius: 25px;

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);

            background: white;
        }

        .slide {
            position: absolute;

            width: 100%;

            height: 100%;

            left: 0;
            top: 0;

            object-fit: contain;

            background: #fff;

            opacity: 0;

            animation: changePhoto 63s infinite;
        }


        /* =========================
           21 PHOTOS
           ========================= */

        .slide:nth-child(1) {
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            animation-delay: 3s;
        }

        .slide:nth-child(3) {
            animation-delay: 6s;
        }

        .slide:nth-child(4) {
            animation-delay: 9s;
        }

        .slide:nth-child(5) {
            animation-delay: 12s;
        }

        .slide:nth-child(6) {
            animation-delay: 15s;
        }

        .slide:nth-child(7) {
            animation-delay: 18s;
        }

        .slide:nth-child(8) {
            animation-delay: 21s;
        }

        .slide:nth-child(9) {
            animation-delay: 24s;
        }

        .slide:nth-child(10) {
            animation-delay: 27s;
        }

        .slide:nth-child(11) {
            animation-delay: 30s;
        }

        .slide:nth-child(12) {
            animation-delay: 33s;
        }

        .slide:nth-child(13) {
            animation-delay: 36s;
        }

        .slide:nth-child(14) {
            animation-delay: 39s;
        }

        .slide:nth-child(15) {
            animation-delay: 42s;
        }

        .slide:nth-child(16) {
            animation-delay: 45s;
        }

        .slide:nth-child(17) {
            animation-delay: 48s;
        }

        .slide:nth-child(18) {
            animation-delay: 51s;
        }

        .slide:nth-child(19) {
            animation-delay: 54s;
        }

        .slide:nth-child(20) {
            animation-delay: 57s;
        }

        .slide:nth-child(21) {
            animation-delay: 60s;
        }


        /* =========================
           PHOTO FADE
           ========================= */

        @keyframes changePhoto {

            0% {
                opacity: 0;
            }

            3% {
                opacity: 1;
            }

            12% {
                opacity: 1;
            }

            15% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =========================
           ENDING MESSAGE
           ========================= */

        .message {
            margin-top: 30px;

            font-size: 25px;

            font-weight: bold;

            color: #c9365b;
        }

        .ending {
            font-size: 20px;

            color: #8e4555;
        }


        /* =========================
           MOVIE CREDITS BUTTON
           ========================= */

        .credits-button {
            display: inline-block;

            margin-top: 30px;

            padding: 16px 35px;

            background: #c9365b;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 19px;

            font-weight: bold;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

            transition: 0.3s;
        }

        .credits-button:hover {
            transform: scale(1.08);

            background: #a92749;
        }


        /* =========================
           FLOATING HEARTS
           ========================= */

        .heart {
            position: fixed;

            font-size: 28px;

            pointer-events: none;

            animation: float 6s linear infinite;

            opacity: 0.7;
        }

        .h1 {
            left: 8%;
            bottom: -40px;
        }

        .h2 {
            left: 25%;
            bottom: -60px;

            animation-delay: 2s;
        }

        .h3 {
            right: 20%;
            bottom: -50px;

            animation-delay: 1s;
        }

        .h4 {
            right: 8%;
            bottom: -70px;

            animation-delay: 3s;
        }


        @keyframes float {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-110vh);
            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 34px;
            }

            .slideshow {
                height: 400px;
            }

            .credits-button {
                font-size: 17px;

                padding: 14px 28px;
            }

        }

    </style>

</head>


<body>
